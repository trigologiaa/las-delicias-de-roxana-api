services:
  db:
    environment:
      POSTGRES_DB: delicias
      POSTGRES_PASSWORD: delicias
      POSTGRES_USER: delicias
      TZ: America/Argentina/Buenos_Aires
    healthcheck:
      interval: 2s
      retries: 20
      test: ["CMD-SHELL", "pg_isready -U delicias -d delicias"]
      timeout: 3s
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
